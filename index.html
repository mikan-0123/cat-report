<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 餌やり報告・履歴</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --primary: #0288D1;
      --line-green: #00B900;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .reporter-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .reporter-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #2e7d32;
    }

    .reporter-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: #1b5e20;
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 12px 0;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px solid var(--line-green);
      padding-bottom: 6px;
    }

    .section-divider {
      margin: 32px 0 16px 0;
      text-align: center;
      position: relative;
    }

    .section-divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px dashed #bbb;
      z-index: 1;
    }

    .section-divider span {
      background: var(--bg);
      padding: 0 12px;
      position: relative;
      z-index: 2;
      font-size: 0.9rem;
      font-weight: bold;
      color: #666;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label.field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 6px;
    }

    .select-box,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fafafa;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-btn {
      display: inline-block;
      text-align: center;
      background: #eef2f5;
      border: 1px dashed #90a4ae;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #37474f;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 8px;
      display: none;
      margin-top: 6px;
      background: #222;
    }

    .preview-hint {
      font-size: 0.75rem;
      color: #777;
      margin-top: 2px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-num {
      flex: 1;
      padding: 10px 0;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }

    .btn-num.active {
      background: var(--line-green);
      color: #fff;
      border-color: var(--line-green);
    }

    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .cat-item:last-child {
      border-bottom: none;
    }

    .cat-name {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .25s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: var(--line-green);
    }

    input:checked+.slider:before {
      transform: translateX(22px);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(2, 136, 209, 0.3);
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .submit-btn:disabled {
      background-color: #aaa;
      box-shadow: none;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 30px 16px;
      color: #666;
      font-size: 0.9rem;
    }

    .log-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .log-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-date {
      font-weight: bold;
      font-size: 0.95rem;
      color: #111;
    }

    .log-user {
      font-size: 0.8rem;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .delete-btn {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #ef9a9a;
    }

    .photo-grid {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .photo-box {
      flex: 1;
      text-align: center;
    }

    .photo-label {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .photo-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #eee;
      cursor: pointer;
    }

    .cats-badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .cat-badge {
      font-size: 0.75rem;
      background: #fff3e0;
      color: #e65100;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #ffe082;
    }

    .detail-row {
      font-size: 0.85rem;
      color: #555;
      margin-top: 4px;
      line-height: 1.4;
    }

    .note-box {
      margin-top: 8px;
      padding: 8px 10px;
      background: #fdfefe;
      border-left: 3px solid var(--primary);
      font-size: 0.85rem;
      color: #444;
      white-space: pre-wrap;
      border-radius: 0 6px 6px 0;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 85%;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <!-- 報告者表示枠 -->
  <div class="reporter-box">
    <span class="reporter-label">👤 報告者（LINE名）</span>
    <span id="userNameDisplay" class="reporter-name">取得中...</span>
  </div>

  <!-- 教育エリア -->
  <div class="card">
    <h2>🏫 教育エリア</h2>
    <div class="form-group">
      <label class="field-label">📷 教育の写真（最大6枚・自動結合）</label>
      <div class="file-input-wrapper">
        <label class="file-btn" for="kyoikuPhotoInput">📷 写真を選択 / 撮影（最大6枚）</label>
        <input type="file" id="kyoikuPhotoInput" accept="image/*" multiple onchange="handleProcessImages(this, 'kyoiku')">
        <img id="previewKyoiku" class="preview-img" alt="教育の結合写真プレビュー">
        <span id="hintKyoiku" class="preview-hint" style="display:none;"></span>
      </div>
    </div>
    <div class="form-group">
      <label class="field-label" for="kyoikuFood">🍚 エサの量</label>
      <select id="kyoikuFood" class="select-box"></select>
    </div>
    <div class="form-group">
      <label class="field-label">🐱 教育の子猫（匹数）</label>
      <div class="btn-group" id="kittenGroup">
        <button type="button" class="btn-num active" onclick="selectKitten(0)">0匹</button>
        <button type="button" class="btn-num" onclick="selectKitten(1)">1匹</button>
        <button type="button" class="btn-num" onclick="selectKitten(2)">2匹</button>
        <button type="button" class="btn-num" onclick="selectKitten(3)">3匹</button>
        <button type="button" class="btn-num" onclick="selectKitten(4)">4匹</button>
      </div>
    </div>
    <div class="form-group">
      <label class="field-label">🐈 成猫の確認</label>
      <div class="cat-item">
        <span class="cat-name">教育の親猫</span>
        <label class="switch">
          <input type="checkbox" id="cat_教育の親猫">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- デッキエリア -->
  <div class="card">
    <h2>🏡 デッキエリア</h2>
    <div class="form-group">
      <label class="field-label">📷 デッキの写真（最大6枚・自動結合）</label>
      <div class="file-input-wrapper">
        <label class="file-btn" for="deckPhotoInput">📷 写真を選択 / 撮影（最大6枚）</label>
        <input type="file" id="deckPhotoInput" accept="image/*" multiple onchange="handleProcessImages(this, 'deck')">
        <img id="previewDeck" class="preview-img" alt="デッキの結合写真プレビュー">
        <span id="hintDeck" class="preview-hint" style="display:none;"></span>
      </div>
    </div>
    <div class="form-group">
      <label class="field-label" for="deckFood">🍚 エサの量</label>
      <select id="deckFood" class="select-box"></select>
    </div>
    <div class="form-group">
      <label class="field-label">🐈 確認できた猫</label>
      <div id="deckCatsList"></div>
    </div>
  </div>

  <!-- 備考 -->
  <div class="card">
    <h2>📝 備考</h2>
    <div class="form-group">
      <textarea id="noteTextInput" placeholder="特記事項（体調不良、怪我、残餌など）があれば自由に入力してください"></textarea>
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitData()">📝 この内容でNotionに登録</button>

  <!-- 履歴一覧 -->
  <div class="section-divider">
    <span>📋 直近の活動記録・写真一覧</span>
  </div>

  <div id="loading" class="loading">⏳ 履歴データを取得中...</div>
  <div id="logContainer"></div>

  <!-- 画像拡大モーダル -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImg" src="" alt="拡大写真">
  </div>

  <script>
    // 指定された最新のGAS WebアプリURL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby7Xu0-XCzeCZ7SdP0MUV9obCslRzXCTsTnPIDle7QjpmAjdzjgzO1gNNGNYt-VGbpg1g/exec";[cite: 1]
    const LIFF_ID = "2011245589-M2Y0zVZY";[cite: 1]

    const DECK_CATS = ['黒蜜', 'はいちゃん', 'ちびとら', 'チーズケーキ', 'でかとら'];[cite: 1]
    let selectedKitten = 0;[cite: 1]
    let kyoikuBase64 = null;[cite: 1]
    let deckBase64 = null;[cite: 1]
    let currentUserName = '担当者';[cite: 1]

    window.addEventListener('DOMContentLoaded', async () => {
      buildFoodSelects();
      buildDeckCats();
      await initLiff(); // 担当者名を先に取得してから履歴を生成
      loadHistory();
    });

    function buildFoodSelects() {
      const selects = ['kyoikuFood', 'deckFood'];[cite: 1]
      let optionsHtml = '<option value="0">0g（未入力）</option>';[cite: 1]
      for (let i = 10; i <= 120; i += 10) {[cite: 1]
        optionsHtml += `<option value="${i}">${i}g</option>`;[cite: 1]
      }
      selects.forEach(id => {[cite: 1]
        const el = document.getElementById(id);[cite: 1]
        if (el) el.innerHTML = optionsHtml;[cite: 1]
      });
    }

    async function initLiff() {
      const displayEl = document.getElementById('userNameDisplay');[cite: 1]
      try {
        await liff.init({ liffId: LIFF_ID });[cite: 1]

        if (!liff.isLoggedIn()) {[cite: 1]
          liff.login();[cite: 1]
          return;[cite: 1]
        }

        const profile = await liff.getProfile();[cite: 1]
        if (profile && profile.displayName) {[cite: 1]
          currentUserName = profile.displayName;[cite: 1]
          displayEl.innerText = currentUserName;[cite: 1]
        }
      } catch (err) {
        console.error('LIFF Error:', err);[cite: 1]
        displayEl.innerText = '担当者';[cite: 1]
      }
    }

    function buildDeckCats() {
      const container = document.getElementById('deckCatsList');[cite: 1]
      container.innerHTML = DECK_CATS.map(cat => `
        <div class="cat-item">
          <span class="cat-name">${cat}</span>
          <label class="switch">
            <input type="checkbox" id="cat_${cat}">
            <span class="slider"></span>
          </label>
        </div>
      `).join('');[cite: 1]
    }

    async function loadHistory() {
      const loading = document.getElementById('loading');[cite: 1]
      loading.style.display = 'block';[cite: 1]
      loading.innerHTML = '⏳ 履歴データを取得中...';[cite: 1]

      try {
        const res = await fetch(`${GAS_API_URL}?t=${Date.now()}`);[cite: 1]
        const data = await res.json();[cite: 1]
        if (data.success) {[cite: 1]
          renderLogs(data.logs);[cite: 1]
        } else {
          loading.innerHTML = '❌ 履歴読み込み失敗: ' + (data.error || '不明なエラー');[cite: 1]
        }
      } catch (err) {
        loading.innerHTML = '❌ 通信エラー: ' + err.message;[cite: 1]
      }
    }

    function renderLogs(logs) {
      const container = document.getElementById('logContainer');[cite: 1]
      const loading = document.getElementById('loading');[cite: 1]
      loading.style.display = 'none';[cite: 1]
      container.innerHTML = '';[cite: 1]

      if (!logs || logs.length === 0) {[cite: 1]
        container.innerHTML = '<div style="text-align:center; padding: 20px; color:#888;">履歴がまだありません</div>';[cite: 1]
        return;[cite: 1]
      }

      const nowTime = Date.now();
      const twoDaysMs = 2 * 24 * 60 * 60 * 1000; // 48時間

      container.innerHTML = logs.map(log => {
        let catBadges = (log.cats || []).map(c => `<span class="cat-badge">🐱 ${c}</span>`).join('');[cite: 1]
        if (log.kittenCount > 0) {[cite: 1]
          catBadges += `<span class="cat-badge" style="background:#e3f2fd; color:#1565c0; border-color:#bbdefb;">🐾 子猫: ${log.kittenCount}匹</span>`;[cite: 1]
        }

        let photoHtml = '';[cite: 1]
        if (log.kyoikuPhoto || log.deckPhoto) {[cite: 1]
          photoHtml = '<div class="photo-grid">';[cite: 1]
          if (log.kyoikuPhoto) {[cite: 1]
            photoHtml += `
              <div class="photo-box">
                <div class="photo-label">🏫 教育エリア</div>
                <img class="photo-img" src="${log.kyoikuPhoto}" loading="lazy" onclick="openModal('${log.kyoikuPhoto}')" alt="教育の写真">
              </div>`;[cite: 1]
          }
          if (log.deckPhoto) {[cite: 1]
            photoHtml += `
              <div class="photo-box">
                <div class="photo-label">🏡 デッキエリア</div>
                <img class="photo-img" src="${log.deckPhoto}" loading="lazy" onclick="openModal('${log.deckPhoto}')" alt="デッキの写真">
              </div>`;[cite: 1]
          }
          photoHtml += '</div>';[cite: 1]
        }

        const noteHtml = log.note ? `<div class="note-box">💬 <strong>備考:</strong> ${log.note}</div>` : '';[cite: 1]

        // 削除条件チェック: 本人 かつ 2日以内
        const logTime = log.rawDate ? new Date(log.rawDate).getTime() : 0;
        const isWithinTwoDays = (nowTime - logTime) <= twoDaysMs;
        const isMyLog = currentUserName !== '担当者' && log.user === currentUserName;
        const canDelete = isMyLog && isWithinTwoDays && log.pageId;

        const deleteButtonHtml = canDelete
          ? `<button class="delete-btn" onclick="confirmDeleteLog('${log.pageId}')">🗑️ 削除</button>`
          : '';

        return `
          <div class="log-card" id="card-${log.pageId}">
            <div class="log-header">
              <div class="log-header-left">
                <span class="log-date">${log.date}</span>
                <span class="log-user">👤 ${log.user}</span>
              </div>
              <div class="log-header-right">
                ${deleteButtonHtml}
              </div>
            </div>
            ${photoHtml}
            <div class="cats-badge-container">
              ${catBadges || '<span style="font-size:0.75rem; color:#999;">確認猫なし</span>'}
            </div>
            <div class="detail-row">🍚 <strong>エサ量:</strong> 教育 ${log.kyoikuFood}g / デッキ ${log.deckFood}g</div>
            ${noteHtml}
          </div>
        `;
      }).join('');[cite: 1]
    }

    // ==================== 削除実行処理 ====================
    async function confirmDeleteLog(pageId) {
      if (!confirm('⚠️ この報告を本当に削除しますか？\n（Notionからも削除されます）')) {
        return;
      }

      const card = document.getElementById(`card-${pageId}`);
      if (card) {
        card.style.opacity = '0.4';
        card.style.pointerEvents = 'none';
      }

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'deleteLog',
            pageId: pageId
          })
        });

        const data = await res.json();
        if (data.success) {
          alert('🗑️ 報告を削除しました。');
          loadHistory();
        } else {
          alert('❌ 削除に失敗しました: ' + (data.error || '不明なエラー'));
          if (card) {
            card.style.opacity = '1';
            card.style.pointerEvents = 'auto';
          }
        }
      } catch (err) {
        alert('❌ 通信エラー: ' + err.message);
        if (card) {
          card.style.opacity = '1';
          card.style.pointerEvents = 'auto';
        }
      }
    }

    function openModal(src) {
      document.getElementById('modalImg').src = src;[cite: 1]
      document.getElementById('imageModal').style.display = 'flex';[cite: 1]
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';[cite: 1]
    }

    function selectKitten(num) {
      selectedKitten = num;[cite: 1]
      document.querySelectorAll('.btn-num').forEach((btn, idx) => {[cite: 1]
        btn.classList.toggle('active', idx === num);[cite: 1]
      });
    }

    // ==================== 画像結合・リサイズ処理 (最大6枚) ====================
    async function handleProcessImages(input, areaType) {
      const files = Array.from(input.files).slice(0, 6);
      if (!files.length) return;[cite: 1]

      const previewEl = document.getElementById(areaType === 'kyoiku' ? 'previewKyoiku' : 'previewDeck');[cite: 1]
      const hintEl = document.getElementById(areaType === 'kyoiku' ? 'hintKyoiku' : 'hintDeck');[cite: 1]

      hintEl.style.display = 'block';[cite: 1]
      hintEl.innerText = `⏳ 写真（${files.length}枚）を結合・最適化中...`;[cite: 1]

      try {
        const loadedImages = await Promise.all(files.map(file => {[cite: 1]
          return new Promise((resolve, reject) => {[cite: 1]
            const reader = new FileReader();[cite: 1]
            reader.onload = (e) => {[cite: 1]
              const img = new Image();[cite: 1]
              img.onload = () => resolve(img);[cite: 1]
              img.onerror = reject;[cite: 1]
              img.src = e.target.result;[cite: 1]
            };
            reader.onerror = reject;[cite: 1]
            reader.readAsDataURL(file);[cite: 1]
          });
        }));

        const combinedBase64 = createCollage(loadedImages);

        if (areaType === 'kyoiku') {[cite: 1]
          kyoikuBase64 = combinedBase64;[cite: 1]
        } else {
          deckBase64 = combinedBase64;[cite: 1]
        }

        previewEl.src = combinedBase64;[cite: 1]
        previewEl.style.display = 'block';[cite: 1]
        hintEl.innerText = `✅ ${files.length}枚の写真を1枚にレイアウトしました`;[cite: 1]
      } catch (err) {
        console.error('画像結合エラー:', err);[cite: 1]
        hintEl.innerText = '❌ 画像の処理に失敗しました';[cite: 1]
      }
    }

    function createCollage(images) {
      const canvas = document.createElement('canvas');[cite: 1]
      const ctx = canvas.getContext('2d');[cite: 1]
      const count = images.length;[cite: 1]
      const targetSize = 1080;[cite: 1]

      function drawCover(img, x, y, w, h) {
        const imgRatio = img.width / img.height;[cite: 1]
        const targetRatio = w / h;[cite: 1]
        let sx, sy, sw, sh;[cite: 1]

        if (imgRatio > targetRatio) {[cite: 1]
          sh = img.height;[cite: 1]
          sw = sh * targetRatio;[cite: 1]
          sy = 0;[cite: 1]
          sx = (img.width - sw) / 2;[cite: 1]
        } else {
          sw = img.width;[cite: 1]
          sh = sw / targetRatio;[cite: 1]
          sx = 0;[cite: 1]
          sy = (img.height - sh) / 2;[cite: 1]
        }

        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);[cite: 1]
      }

      if (count === 1) {[cite: 1]
        let w = images[0].width;[cite: 1]
        let h = images[0].height;[cite: 1]
        if (w > h && w > targetSize) {[cite: 1]
          h = Math.round((h * targetSize) / w);[cite: 1]
          w = targetSize;[cite: 1]
        } else if (h > targetSize) {[cite: 1]
          w = Math.round((w * targetSize) / h);[cite: 1]
          h = targetSize;[cite: 1]
        }
        canvas.width = w;[cite: 1]
        canvas.height = h;[cite: 1]
        ctx.drawImage(images[0], 0, 0, w, h);[cite: 1]

      } else if (count === 2) {[cite: 1]
        canvas.width = targetSize;[cite: 1]
        canvas.height = 810;[cite: 1]
        ctx.fillStyle = '#ffffff';[cite: 1]
        ctx.fillRect(0, 0, canvas.width, canvas.height);[cite: 1]

        const halfW = targetSize / 2;[cite: 1]
        drawCover(images[0], 0, 0, halfW - 2, 810);[cite: 1]
        drawCover(images[1], halfW + 2, 0, halfW - 2, 810);[cite: 1]

      } else if (count === 3) {[cite: 1]
        canvas.width = targetSize;[cite: 1]
        canvas.height = targetSize;[cite: 1]
        ctx.fillStyle = '#ffffff';[cite: 1]
        ctx.fillRect(0, 0, canvas.width, canvas.height);[cite: 1]

        const halfW = targetSize / 2;[cite: 1]
        const halfH = targetSize / 2;[cite: 1]
        drawCover(images[0], 0, 0, halfW - 2, targetSize);[cite: 1]
        drawCover(images[1], halfW + 2, 0, halfW - 2, halfH - 2);[cite: 1]
        drawCover(images[2], halfW + 2, halfH + 2, halfW - 2, halfH - 2);[cite: 1]

      } else if (count === 4) {[cite: 1]
        canvas.width = targetSize;[cite: 1]
        canvas.height = targetSize;[cite: 1]
        ctx.fillStyle = '#ffffff';[cite: 1]
        ctx.fillRect(0, 0, canvas.width, canvas.height);[cite: 1]

        const halfW = targetSize / 2;[cite: 1]
        const halfH = targetSize / 2;[cite: 1]
        drawCover(images[0], 0, 0, halfW - 2, halfH - 2);[cite: 1]
        drawCover(images[1], halfW + 2, 0, halfW - 2, halfH - 2);[cite: 1]
        drawCover(images[2], 0, halfH + 2, halfW - 2, halfH - 2);[cite: 1]
        drawCover(images[3], halfW + 2, halfH + 2, halfW - 2, halfH - 2);[cite: 1]

      } else if (count === 5) {
        canvas.width = targetSize;
        canvas.height = targetSize;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const rowH = targetSize / 2;
        const topW = targetSize / 2;
        const btmW = targetSize / 3;

        drawCover(images[0], 0, 0, topW - 2, rowH - 2);
        drawCover(images[1], topW + 2, 0, topW - 2, rowH - 2);
        drawCover(images[2], 0, rowH + 2, btmW - 2, rowH - 2);
        drawCover(images[3], btmW + 2, rowH + 2, btmW - 2, rowH - 2);
        drawCover(images[4], (btmW * 2) + 2, rowH + 2, btmW - 2, rowH - 2);

      } else {
        canvas.width = targetSize;
        canvas.height = Math.round(targetSize * (2 / 3));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const colW = targetSize / 3;
        const rowH = canvas.height / 2;

        for (let i = 0; i < 6; i++) {
          const col = i % 3;
          const row = Math.floor(i / 3);
          const x = col * colW + (col > 0 ? 2 : 0);
          const y = row * rowH + (row > 0 ? 2 : 0);
          const w = colW - 2;
          const h = rowH - 2;
          drawCover(images[i], x, y, w, h);
        }
      }

      return canvas.toDataURL('image/jpeg', 0.75);[cite: 1]
    }

    async function submitData() {
      const submitBtn = document.getElementById('submitBtn');[cite: 1]
      submitBtn.disabled = true;[cite: 1]
      submitBtn.innerText = '登録中...（送信中）';[cite: 1]

      const checkedCats = ['教育の親猫', ...DECK_CATS];[cite: 1]
      const checkedState = {};[cite: 1]
      const confirmedCatsList = [];[cite: 1]

      checkedCats.forEach(cat => {[cite: 1]
        const el = document.getElementById(`cat_${cat}`);[cite: 1]
        const isChecked = el ? el.checked : false;[cite: 1]
        checkedState[cat] = isChecked;[cite: 1]
        if (isChecked) {[cite: 1]
          confirmedCatsList.push(cat);[cite: 1]
        }

      const kyoikuFood = Number(document.getElementById('kyoikuFood').value) || 0;[cite: 1]
      const deckFood = Number(document.getElementById('deckFood').value) || 0;[cite: 1]
      const noteText = document.getElementById('noteTextInput').value.trim();[cite: 1]

      const payload = {[cite: 1]
        userName: currentUserName,[cite: 1]
        formData: {[cite: 1]
          kyoikuPhoto: kyoikuBase64,[cite: 1]
          deckPhoto: deckBase64,[cite: 1]
          kyoikuFoodAmount: kyoikuFood,[cite: 1]
          deckFoodAmount: deckFood,[cite: 1]
          kittenCount: selectedKitten,[cite: 1]
          checked: checkedState,[cite: 1]
          noteText: noteText[cite: 1]
        }
      };

      try {
        const res = await fetch(GAS_API_URL, {[cite: 1]
          method: 'POST',[cite: 1]
          body: JSON.stringify(payload)[cite: 1]
        });
        const data = await res.json();[cite: 1]

        if (data.success) {[cite: 1]
          if (liff.isInClient()) {[cite: 1]
            submitBtn.innerText = 'チャットへ送信中...';[cite: 1]

            const catStr = confirmedCatsList.length > 0 ? confirmedCatsList.join('、') : 'なし';[cite: 1]

            const messageLines = [[cite: 1]
              `🐾 【餌やり報告】`,[cite: 1]
              `👤 担当: ${currentUserName}`,[cite: 1]
              `--------------------`,[cite: 1]
              `🏫 教育: ${kyoikuFood}g (子猫: ${selectedKitten}匹)`,[cite: 1]
              `🏡 デッキ: ${deckFood}g`,[cite: 1]
              `🐈 確認: ${catStr}`,[cite: 1]
              noteText ? `📝 備考: ${noteText}` : null[cite: 1]
            ];

            const fullMessageText = messageLines.filter(Boolean).join('\n');[cite: 1]

            const messagesToSend = [[cite: 1]
              {
                type: 'text',[cite: 1]
                text: fullMessageText[cite: 1]
              }
            ];

            if (data.lineKyoikuPhoto) {[cite: 1]
              messagesToSend.push({[cite: 1]
                type: 'image',[cite: 1]
                originalContentUrl: data.lineKyoikuPhoto,[cite: 1]
                previewImageUrl: data.lineKyoikuPhoto[cite: 1]
              });
            }

            if (data.lineDeckPhoto) {[cite: 1]
              messagesToSend.push({[cite: 1]
                type: 'image',[cite: 1]
                originalContentUrl: data.lineDeckPhoto,[cite: 1]
                previewImageUrl: data.lineDeckPhoto[cite: 1]
              });
            }

            try {
              await liff.sendMessages(messagesToSend);[cite: 1]
              alert('🐾 報告と写真をチャットに送信しました！');[cite: 1]
            } catch (sendErr) {
              console.error('LINE送信失敗詳細:', sendErr);[cite: 1]
              alert('⚠️ メッセージ送信でエラーが発生しました:\n' + sendErr.message);[cite: 1]
            }

            liff.closeWindow();[cite: 1]
          } else {
            alert('🐾 Notionに保存しました！');[cite: 1]
            resetForm();[cite: 1]
            loadHistory();[cite: 1]
            submitBtn.disabled = false;[cite: 1]
            submitBtn.innerText = '📝 この内容でNotionに登録';[cite: 1]
          }
        } else {
          alert('❌ 保存失敗:\n' + data.error);[cite: 1]
          submitBtn.disabled = false;[cite: 1]
          submitBtn.innerText = '📝 この内容でNotionに登録';[cite: 1]
        }
      } catch (err) {
        alert('❌ 通信エラー: ' + err.message);[cite: 1]
        submitBtn.disabled = false;[cite: 1]
        submitBtn.innerText = '📝 この内容でNotionに登録';[cite: 1]
      }
    }
